; Zero Hour Reforged's own unit voices, then Turkiye's announcer and its weapons, loaded after
; SpeechReforged.ini. Audio is not in the
; multiplayer checksum; the Voice fields in TurkiyeReforged.ini that name these events are.
;
; Every Turkiye unit speaks in a voice of its own: English lines read with a Turkish accent,
; generated with ElevenLabs (eleven_v3) and put through ffmpeg to EA's speech format, 22050 Hz mono
; 16-bit at -16 LUFS, where EA's own voice files sit (-15 to -16). The wavs are
; Code/Data/Audio/Sounds/<code><line>.wav, copied to Run/Data/Audio/Sounds by the build, and their
; names follow EA's: a four-letter code, then se select, mo move, at attack, fe fear, seg the line a
; unit says when it is made, and a letter. The script and the casting live outside this repository.
;
; The events take the shape of EA's: ui voice player at 90 for an answer to an order, world global
; player at 110 for the first line, world shrouded player at 100 for fear. The drones, the jets and
; the helicopter speak over EA's radio clicks, as the Comanche and the Raptor do.

; ---- Mehmetcik (imeh) ---------------------------------------------------------------------------

AudioEvent TurkiyeMehmetcikVoiceSelect
  Sounds = imehsea imehseb imehsec imehsed imehsee
  Control = random
  Volume = 90
  Type = ui voice player
End

AudioEvent TurkiyeMehmetcikVoiceMove
  Sounds = imehmoa imehmob imehmoc imehmod imehmoe
  Control = random
  Volume = 90
  Type = ui voice player
End

AudioEvent TurkiyeMehmetcikVoiceAttack
  Sounds = imehata imehatb imehatc imehatd imehate
  Control = random
  Volume = 90
  Type = ui voice player
End

AudioEvent TurkiyeMehmetcikVoiceFear
  Sounds = imehfea imehfeb
  Control = random
  Volume = 100
  MinVolume = 90
  Type = world shrouded player
End

AudioEvent TurkiyeMehmetcikVoiceCreate
  Sounds = imehseg
  Control = random
  Volume = 110
  MinVolume = 100
  Priority = high
  Type = world global player
End

