; ---- The announcer (et) --------------------------------------------------------------------------
;
; Turkiye's own announcer, a woman reading English with a Turkish accent, one line for every event
; America's has a line for. EvaReforged.ini hands each one to its EvaEvent. These are EA's
; DialogEvents, the shape of EvaUSA_*: a speech stream, so the wavs are
; Code/Data/Audio/Speech/et<event>.wav, copied to Run/Data/Audio/Speech by the build, in the same
; format and loudness as the unit voices above.

