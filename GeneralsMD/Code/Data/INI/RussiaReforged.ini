; ---- hand patches (not generated) ----

; Pantsir site: the Avenger's point defense laser over the Gattling site, so drones and small
; missiles over the base are shot down (the Pantsir-S1 vehicle has the Avenger's own two)
Object RussiaPantsirPos
  AddModule
    Behavior = PointDefenseLaserUpdate ModuleTag_RussiaPointDefense
      WeaponTemplate        = AvengerPointDefenseLaserOne
      PrimaryTargetTypes    = BALLISTIC_MISSILE SMALL_MISSILE
      ScanRate              = 0
      ScanRange             = 200.0
      PredictTargetVelocityFactor = 1.0
    End
  End
End

; T-14 Armata: active protection, one point defense channel against missiles and drones
Object RussiaTankT14
  AddModule
    Behavior = PointDefenseLaserUpdate ModuleTag_RussiaAPS
      WeaponTemplate        = AvengerPointDefenseLaserTwo
      PrimaryTargetTypes    = SMALL_MISSILE
      ScanRate              = 100
      ScanRange             = 120.0
      PredictTargetVelocityFactor = 1.0
    End
  End
End

; Krasukha: no gun; enemy drones and spotters inside 300 go blind, guided missiles lose lock
Object RussiaVehicleKrasukha
  AddModule
    Behavior = JammerUpdate ModuleTag_RussiaJammer
      Radius   = 300
      ScanRate = 166
    End
  End
End

; KamAZ: the China truck's AI with the Tax bonus on a full load
Object RussiaVehicleKamaz
  ReplaceModule ModuleTag_03
    Behavior = SupplyTruckAIUpdate ModuleTag_03_Russia
      MaxBoxes = 4
      SupplyCenterActionDelay = 400
      SupplyWarehouseActionDelay = 1000
      SupplyWarehouseScanDistance = 700
      SuppliesDepletedVoice = SupplyTruckVoiceSuppliesDepleted
      UpgradedBoost = UpgradeType:Upgrade_RussiaTax Boost:50
    End
  End
End

; Voenkomat: a free Reservist every 60 s while fewer than 5 of them live; they are the player's own
Object RussiaVoenkomat
  AddModule
    Behavior = SpawnBehavior ModuleTag_RussiaReservists
      SpawnNumber           = 5
      SpawnReplaceDelay     = 60000
      SpawnTemplateName     = RussiaInfantryReservist
      CanReclaimOrphans     = No
      SpawnedRequireSpawner = No
      SlavesHaveFreeWill    = Yes
      InitialBurst          = 1
    End
  End
  ; the propaganda center has no exit, and SpawnBehavior silently does nothing without one
  AddModule
    Behavior = DefaultProductionExitUpdate ModuleTag_RussiaReservistExit
      UnitCreatePoint   = X: 0.0 Y: -25.0 Z: 0.0
      NaturalRallyPoint = X: 36.0 Y: -25.0 Z: 0.0
    End
  End
End

; Oil derricks pay Russia's Oil-gas complex too (the first owned upgrade in the list wins)
Object TechOilDerrick
  ReplaceModule ModuleTag_04
    Behavior = AutoDepositUpdate ModuleTag_04_Russia
      DepositTiming       = 12000
      DepositAmount       = 200
      InitialCaptureBonus = 1000
      UpgradedBoost       = UpgradeType:Upgrade_AmericaSupplyLines Boost:20
      UpgradedBoost       = UpgradeType:Upgrade_RussiaOilGas Boost:100
    End
  End
End

