; Buildings (Tools/Russia/models/bld.py). Footprint stays the source building's Geometry.
; Zoopark-1M radar: phased array turns once per 8 s (12 s damaged), knocked over when really damaged.
; Night/snow fall back to the day model. Construction scaffolding is the China one (ModuleTag_02, kept).
Object RussiaZoopark
  ReplaceModule ModuleTag_01
    Draw = W3DModelDraw ModuleTag_01_Russia
      OkToChangeModelColor = Yes
      DefaultConditionState
        Model         = RUZOOPARK
        Animation     = RUZOOPARK.RUZOOPARK
        AnimationMode = LOOP
      End
      ConditionState = DAMAGED
        Model         = RUZOOPARK_D
        Animation     = RUZOOPARK_D.RUZOOPARK_D
        AnimationMode = LOOP
        ParticleSysBone = Smoke01 SmolderingSmoke
      End
      ConditionState = REALLYDAMAGED
        Model         = RUZOOPARK_E
        ParticleSysBone = Smoke01 SmolderingSmoke
        ParticleSysBone = Smoke02 SmolderingSmoke
        ParticleSysBone = Flame01 SmolderingFire
        ParticleSysBone = Flame01 SmolderingFlameCore
        ParticleSysBone = Spark01 LiveWireSparks
      End
      AliasConditionState = RUBBLE
      AliasConditionState = REALLYDAMAGED RUBBLE
      ConditionState = AWAITING_CONSTRUCTION PARTIALLY_CONSTRUCTED ACTIVELY_BEING_CONSTRUCTED
        Model         = RUZOOPARK
        Animation     = RUZOOPARK.RUZOOPARK
        AnimationMode = LOOP
        Flags         = ADJUST_HEIGHT_BY_CONSTRUCTION_PERCENT
      End
      ConditionState = AWAITING_CONSTRUCTION PARTIALLY_CONSTRUCTED ACTIVELY_BEING_CONSTRUCTED DAMAGED
        Model         = RUZOOPARK_D
        Animation     = RUZOOPARK_D.RUZOOPARK_D
        AnimationMode = LOOP
        Flags         = ADJUST_HEIGHT_BY_CONSTRUCTION_PERCENT
      End
      ConditionState = AWAITING_CONSTRUCTION PARTIALLY_CONSTRUCTED ACTIVELY_BEING_CONSTRUCTED REALLYDAMAGED
        Model         = RUZOOPARK_E
        Flags         = ADJUST_HEIGHT_BY_CONSTRUCTION_PERCENT
      End
      ConditionState = AWAITING_CONSTRUCTION
        Model         = NONE
      End
      AliasConditionState = AWAITING_CONSTRUCTION DAMAGED
      AliasConditionState = AWAITING_CONSTRUCTION REALLYDAMAGED
      AliasConditionState = SOLD
      AliasConditionState = SOLD DAMAGED
      AliasConditionState = SOLD REALLYDAMAGED
    End
  End
  ; the China speaker tower's healing stays, its red propaganda rings do not fit a radar
  ReplaceModule ModuleTag_06
    Behavior = PropagandaTowerBehavior ModuleTag_06_Russia
      Radius                        = 150.0
      DelayBetweenUpdates           = 2000
      HealPercentEachSecond         = 2%
      PulseFX                       = None
      UpgradeRequired               = Upgrade_ChinaSubliminalMessaging
      UpgradedHealPercentEachSecond = 4%
      UpgradedPulseFX               = None
    End
  End
End
