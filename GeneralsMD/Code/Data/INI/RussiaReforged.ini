;; RUSSIA MODELS (own W3D from Tools/Russia/models; hand-written, not generated)
; T-72B3M: own model RUT72 (alive), RUT72_D (damaged), wreck RUT72_H + thrown turret RUT72_T;
; slat cages CAGES01/02 and Relikt blocks RELIKT01/02 appear with their upgrades
Object RussiaTankT72B3M
  ReplaceModule ModuleTag_01_Reforged
    Draw = W3DTankDraw ModuleTag_01_Russia
      StabilizedTurretPitch = Yes
      OkToChangeModelColor = Yes
      DefaultConditionState
        Model               = RUT72
        Turret              = Turret01
        TurretPitch         = Barrel01
        WeaponFireFXBone    = PRIMARY Muzzle
        WeaponRecoilBone    = PRIMARY Barrel
        WeaponMuzzleFlash   = PRIMARY MuzzleFX
        WeaponLaunchBone    = PRIMARY Muzzle
        HideSubObject       = CAGES01 CAGES02 RELIKT01 RELIKT02
      End
      ConditionState = REALLYDAMAGED
        Model               = RUT72_D
      End
      ConditionState = RUBBLE
        Model               = RUT72_D
      End
      TrackMarks            = EXTnkTrack.tga
    End
  End
  ReplaceModule ModuleTag_12_Reforged
    Behavior = SlowDeathBehavior ModuleTag_12_Russia
      DeathTypes               = ALL -CRUSHED -SPLATTED
      ProbabilityModifier      = 20
      DestructionDelay         = 200
      DestructionDelayVariance = 100
      OCL                      = INITIAL  OCL_ReforgedTankWreckFire
      OCL                      = FINAL    OCL_RussiaT72Toss
      FX                       = FINAL    FX_BattleMasterExplosionOneFinal
    End
  End
  ReplaceModule ModuleTag_ReforgedTankBlast
    Behavior = SlowDeathBehavior ModuleTag_ReforgedTankBlast_Russia
      DeathTypes               = ALL -CRUSHED -SPLATTED
      ProbabilityModifier      = 60
      DestructionDelay         = 100
      DestructionDelayVariance = 50
      OCL                      = MIDPOINT OCL_RussiaT72Wreck
      FX                       = FINAL    FX_BattleMasterExplosionOneFinal
      OCL                      = FINAL    OCL_ReforgedTankWreckFire
    End
  End
  ReplaceModule ModuleTag_ReforgedTankBurn
    Behavior = SlowDeathBehavior ModuleTag_ReforgedTankBurn_Russia
      DeathTypes               = ALL -CRUSHED -SPLATTED
      ProbabilityModifier      = 20
      DestructionDelay         = 6000
      DestructionDelayVariance = 1000
      FX                       = INITIAL  FX_CrusaderCatchFire
      OCL                      = INITIAL  OCL_ReforgedTankWreckFire
      OCL                      = FINAL    OCL_RussiaT72Wreck
      FX                       = FINAL    FX_BattleMasterExplosionOneFinal
    End
  End
  ; upgrade parts: hidden in the default state (damaged states copy it), shown after purchase
  AddModule
    Behavior = SubObjectsUpgrade ModuleTag_RussiaCagesParts
      TriggeredBy    = Upgrade_RussiaCages
      ShowSubObjects = CAGES01 CAGES02
    End
  End
  AddModule
    Behavior = SubObjectsUpgrade ModuleTag_RussiaReliktParts
      TriggeredBy    = Upgrade_RussiaRelikt
      ShowSubObjects = RELIKT01 RELIKT02
    End
  End
End

