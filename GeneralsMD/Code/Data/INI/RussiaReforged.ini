; ---- R3.7 general powers: Russia's in the China powers' module slots (SpecialPowerReforged.ini,
; ObjectCreationListReforged.ini). Napalm 16 -> Kinzhal, Barrage 17 -> Tornado-S, Cluster mines 18 ->
; VDV, EMP 19 -> EW suppression, Cash hack 20 -> Cyberattack, Repair 21 -> Reservists, Early carpet
; bomb 22 -> FAB, Frenzy 27 -> Orlan recon. Reforged's two carpet-bomb fixes go: FAB has their enum.
Object RussiaCommandCenter
  RemoveModule ModuleTag_22Tank_Fix
  RemoveModule ModuleTag_22Nuke_Fix
  ReplaceModule ModuleTag_16
    Behavior = OCLSpecialPower ModuleTag_16_Russia
      SpecialPowerTemplate = SuperweaponRussiaKinzhal
      OCL                  = SUPERWEAPON_RussiaKinzhal
      CreateLocation       = CREATE_AT_LOCATION
    End
  End
  ReplaceModule ModuleTag_17
    Behavior = OCLSpecialPower ModuleTag_17_Russia
      SpecialPowerTemplate = SuperweaponRussiaTornadoS
      UpgradeOCL           = SCIENCE_RussiaTornadoS3 SUPERWEAPON_ArtilleryBarrage3
      UpgradeOCL           = SCIENCE_RussiaTornadoS2 SUPERWEAPON_ArtilleryBarrage2
      OCL                  = SUPERWEAPON_ArtilleryBarrage1
      CreateLocation       = CREATE_AT_EDGE_FARTHEST_FROM_TARGET
    End
  End
  ReplaceModule ModuleTag_18
    Behavior = OCLSpecialPower ModuleTag_18_Russia
      SpecialPowerTemplate = SuperweaponRussiaVDV
      UpgradeOCL           = SCIENCE_RussiaVDV3 SUPERWEAPON_RussiaVDV3
      UpgradeOCL           = SCIENCE_RussiaVDV2 SUPERWEAPON_RussiaVDV2
      OCL                  = SUPERWEAPON_RussiaVDV1
      CreateLocation       = CREATE_AT_EDGE_NEAR_SOURCE
      OCLAdjustPositionToPassable = Yes
    End
  End
  ReplaceModule ModuleTag_19
    Behavior = OCLSpecialPower ModuleTag_19_Russia
      SpecialPowerTemplate = SuperweaponRussiaEWSuppress
      OCL                  = SUPERWEAPON_RussiaEWSuppress
      CreateLocation       = CREATE_AT_LOCATION
    End
  End
  ReplaceModule ModuleTag_20
    Behavior = CashHackSpecialPower ModuleTag_20_Russia
      SpecialPowerTemplate = SuperweaponRussiaCyber
      UpgradeMoneyAmount   = SCIENCE_RussiaCyber3 1500
      UpgradeMoneyAmount   = SCIENCE_RussiaCyber2 1000
      MoneyAmount          = 500
      UpgradeOCL           = SCIENCE_RussiaCyber3 OCL_RussiaCyber3
      UpgradeOCL           = SCIENCE_RussiaCyber2 OCL_RussiaCyber2
      OCL                  = OCL_RussiaCyber1
    End
  End
  ReplaceModule ModuleTag_21
    Behavior = OCLSpecialPower ModuleTag_21_Russia
      SpecialPowerTemplate = SuperweaponRussiaReservists
      OCL                  = SUPERWEAPON_RussiaReservists
      CreateLocation       = CREATE_AT_LOCATION
      OCLAdjustPositionToPassable = Yes
    End
  End
  ReplaceModule ModuleTag_22
    Behavior = OCLSpecialPower ModuleTag_22_Russia
      SpecialPowerTemplate = SuperweaponRussiaFAB
      UpgradeOCL           = SCIENCE_RussiaFAB3 SUPERWEAPON_RussiaFAB3
      UpgradeOCL           = SCIENCE_RussiaFAB2 SUPERWEAPON_RussiaFAB2
      OCL                  = SUPERWEAPON_RussiaFAB1
      CreateLocation       = CREATE_AT_EDGE_NEAR_SOURCE
    End
  End
  ReplaceModule ModuleTag_27
    Behavior = OCLSpecialPower ModuleTag_27_Russia
      SpecialPowerTemplate = SuperweaponRussiaOrlanRecon
      OCL                  = SUPERWEAPON_RussiaOrlanRecon
      CreateLocation       = CREATE_AT_LOCATION
    End
  End
